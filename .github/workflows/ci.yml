name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_TYPE: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ubuntu-cmake-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tests/CMakeLists.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            ubuntu-cmake-

      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl tar xz-utils libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libpulse-dev mesa-vulkan-drivers
          curl -L https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz -o vulkan-sdk.tar.xz
          tar -xf vulkan-sdk.tar.xz
          sdk_root="$(find "$PWD" -maxdepth 1 -type d -name '1.*' | head -n 1)"
          if [ -z "$sdk_root" ]; then
            echo "Failed to locate extracted Vulkan SDK directory" >&2
            exit 1
          fi
          echo "VULKAN_SDK=${sdk_root}/x86_64" >> "$GITHUB_ENV"
          echo "${sdk_root}/x86_64/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${sdk_root}/x86_64/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}

      - name: Build
        shell: bash
        run: cmake --build build --config ${CMAKE_BUILD_TYPE} --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build --build-config ${CMAKE_BUILD_TYPE} --output-on-failure

  windows:
    runs-on: windows-latest
    env:
      CMAKE_BUILD_TYPE: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: windows-cmake-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tests/CMakeLists.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            windows-cmake-

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile vulkan-sdk.exe
          Start-Process -FilePath .\vulkan-sdk.exe -ArgumentList '/S' -Wait
          $sdkRoot = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkRoot) {
            throw 'Failed to locate installed Vulkan SDK.'
          }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:CMAKE_BUILD_TYPE --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --build-config $env:CMAKE_BUILD_TYPE --output-on-failure
